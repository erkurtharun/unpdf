name: Fuzz

# A PDF parser reads untrusted input. The targets in fuzz/ run briefly when parser code
# changes on main, and longer every night; a crash fails the job, and libFuzzer prints the
# crashing input (base64) in the log — reproduce it with `cargo fuzz run <target> <file>`.
# Nothing is uploaded and nothing is published from here.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [load, content, font]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly — libFuzzer instrumentation)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-fuzz
            fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      - name: Seed the corpus
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          if [ "${{ matrix.target }}" = load ]; then
            cp tests/fixtures/*.pdf "fuzz/corpus/${{ matrix.target }}/"
          fi

      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1200' || '120' }}
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_TO_RUN" -timeout=10 -rss_limit_mb=2048
